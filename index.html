<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#e9edf3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1014" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hybrid">
<meta name="description" content="ตารางเทรน Hybrid Athlete 8 สัปดาห์ ติ๊กเช็คได้ พร้อมวิธีทำแต่ละท่าและตัวจับเวลาพัก">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%8B%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Hybrid Athlete — 8 สัปดาห์</title>
<style>
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; }
  img, svg { max-width: 100%; }

  .theme-btn, .sound-btn {
    font-family: var(--mono);
    font-size: .75rem;
    padding: .25rem .5rem;
    margin-left: .5rem;
    border: 1px solid var(--line);
    border-radius: .375rem;
    background: var(--surface);
    color: var(--dim);
    cursor: pointer;
    line-height: 1.4;
  }
  .theme-btn:hover, .sound-btn:hover { color: var(--text); border-color: var(--faint); }
  .theme-btn:focus-visible, .sound-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sound-btn[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
</style>
</head>
<body>
<style>
  :root {
    --bg: #e9edf3;
    --surface: #ffffff;
    --surface-2: #f3f6fa;
    --line: #d3dae5;
    --line-soft: #e3e9f1;
    --text: #121722;
    --dim: #59647a;
    --faint: #8b96a8;
    --accent: #2447e0;
    --accent-soft: #dfe5ff;
    --on-accent: #ffffff;
    --run: #0d7358;
    --run-soft: #d6efe6;
    --warn: #9a670a;
    --warn-soft: #f7ebd2;
    --shadow: 0 1px 2px rgba(18, 23, 34, .06), 0 8px 24px -16px rgba(18, 23, 34, .3);

    --sans: "Segoe UI Variable Text", "Segoe UI", "Noto Sans Thai", "Thonburi",
            system-ui, -apple-system, sans-serif;
    --mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c1014;
      --surface: #151a22;
      --surface-2: #1b222d;
      --line: #28313f;
      --line-soft: #1f2733;
      --text: #e4eaf3;
      --dim: #8d99ac;
      --faint: #66738a;
      --accent: #7f9bff;
      --accent-soft: #1d2842;
    --on-accent: #0c1014;
      --run: #3ecfa3;
      --run-soft: #102c25;
      --warn: #e0ad4d;
      --warn-soft: #2c2415;
      --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 8px 24px -16px rgba(0, 0, 0, .9);
    }
  }

  :root[data-theme="light"] {
    --bg: #e9edf3;
    --surface: #ffffff;
    --surface-2: #f3f6fa;
    --line: #d3dae5;
    --line-soft: #e3e9f1;
    --text: #121722;
    --dim: #59647a;
    --faint: #8b96a8;
    --accent: #2447e0;
    --accent-soft: #dfe5ff;
    --on-accent: #ffffff;
    --run: #0d7358;
    --run-soft: #d6efe6;
    --warn: #9a670a;
    --warn-soft: #f7ebd2;
    --shadow: 0 1px 2px rgba(18, 23, 34, .06), 0 8px 24px -16px rgba(18, 23, 34, .3);
  }

  :root[data-theme="dark"] {
    --bg: #0c1014;
    --surface: #151a22;
    --surface-2: #1b222d;
    --line: #28313f;
    --line-soft: #1f2733;
    --text: #e4eaf3;
    --dim: #8d99ac;
    --faint: #66738a;
    --accent: #7f9bff;
    --accent-soft: #1d2842;
    --on-accent: #0c1014;
    --run: #3ecfa3;
    --run-soft: #102c25;
    --warn: #e0ad4d;
    --warn-soft: #2c2415;
    --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 8px 24px -16px rgba(0, 0, 0, .9);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
  }

  .shell {
    max-width: 34rem;
    margin: 0 auto;
    padding: 1rem 1rem calc(6.5rem + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: .875rem;
  }

  /* ---------- masthead ---------- */
  .masthead {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: .375rem 1rem;
    padding: .25rem .125rem .5rem;
    border-bottom: 1px solid var(--line);
  }
  .masthead h1 {
    margin: 0;
    font-size: 1.0625rem;
    font-weight: 650;
    letter-spacing: -.01em;
  }
  .masthead .brand {
    display: flex;
    align-items: baseline;
    gap: .4375rem;
  }
  .masthead .ver {
    font-family: var(--mono);
    font-size: .6875rem;
    color: var(--faint);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: .3125rem;
    padding: .0625rem .3125rem;
    letter-spacing: .03em;
    white-space: nowrap;
  }
  .masthead .block {
    font-family: var(--mono);
    font-size: .75rem;
    color: var(--faint);
    letter-spacing: .04em;
    white-space: nowrap;
  }

  /* ---------- week / day picker: lane strip ---------- */
  .picker {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: .75rem;
    padding: .625rem;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: .625rem;
  }

  .weeks {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: .25rem;
  }
  .weeks button {
    font-family: var(--mono);
    font-size: .75rem;
    padding: .375rem 0;
    border: 1px solid transparent;
    border-radius: .375rem;
    background: var(--surface-2);
    color: var(--dim);
    cursor: pointer;
    transition: background .12s, color .12s;
  }
  .weeks button[data-deload="1"] { color: var(--warn); }
  .weeks button[aria-pressed="true"] {
    background: var(--accent);
    color: var(--on-accent);
    font-weight: 600;
  }

  .days {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: .25rem;
  }
  .days button {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .3125rem;
    padding: .4375rem 0 .5rem;
    border: 1px solid var(--line-soft);
    border-radius: .5rem;
    background: var(--surface-2);
    color: var(--dim);
    font-family: var(--sans);
    font-size: .8125rem;
    cursor: pointer;
    position: relative;
  }
  .days button[aria-pressed="true"] {
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--text);
    font-weight: 600;
  }
  .days button[data-today="1"]::after {
    content: "";
    position: absolute;
    top: .3125rem;
    right: .3125rem;
    width: .3125rem;
    height: .3125rem;
    border-radius: 50%;
    background: var(--accent);
  }
  /* lane bar = how much of that day is ticked */
  .lane {
    width: 1.375rem;
    height: .25rem;
    border-radius: 1rem;
    background: var(--line);
    overflow: hidden;
  }
  .lane i {
    display: block;
    height: 100%;
    border-radius: 1rem;
    background: var(--accent);
    transition: width .2s ease;
  }
  .days button[data-kind="run"] .lane i { background: var(--run); }
  .days button[data-kind="rest"] .lane i { background: var(--faint); }

  /* ---------- session card ---------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: .75rem;
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .card > header {
    padding: .875rem 1rem .8125rem;
    border-bottom: 1px solid var(--line-soft);
    display: flex;
    flex-direction: column;
    gap: .375rem;
  }
  .kicker {
    display: flex;
    align-items: center;
    gap: .5rem;
    font-family: var(--mono);
    font-size: .6875rem;
    letter-spacing: .07em;
    text-transform: uppercase;
    color: var(--faint);
  }
  .chip {
    padding: .1875rem .4375rem;
    border-radius: .3125rem;
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
    letter-spacing: .05em;
  }
  .chip[data-kind="run"] { background: var(--run-soft); color: var(--run); }
  .chip[data-kind="rest"] { background: var(--surface-2); color: var(--dim); }
  .card > header h2 {
    margin: 0;
    font-size: 1.25rem;
    font-weight: 650;
    letter-spacing: -.015em;
    text-wrap: balance;
  }
  .subline {
    font-size: .8125rem;
    color: var(--dim);
  }

  .banner {
    margin: 0;
    padding: .625rem 1rem;
    background: var(--warn-soft);
    color: var(--warn);
    font-size: .8125rem;
    border-bottom: 1px solid var(--line-soft);
  }
  .banner strong { font-weight: 650; }

  .group-label {
    padding: .75rem 1rem .25rem;
    font-family: var(--mono);
    font-size: .6875rem;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--faint);
  }

  ol.items { list-style: none; margin: 0; padding: 0; }

  li.item {
    display: grid;
    grid-template-columns: 1.75rem 1fr;
    gap: .625rem;
    padding: .6875rem 1rem .6875rem .8125rem;
    border-top: 1px solid var(--line-soft);
    align-items: start;
  }
  li.item:first-child { border-top: none; }

  .tick {
    appearance: none;
    -webkit-appearance: none;
    margin: .0625rem 0 0;
    width: 1.75rem;
    height: 1.75rem;
    border: 1.5px solid var(--line);
    border-radius: .4375rem;
    background: var(--surface-2);
    cursor: pointer;
    display: grid;
    place-items: center;
    flex: none;
    transition: background .12s, border-color .12s;
  }
  .tick::after {
    content: "";
    width: .5rem;
    height: .875rem;
    border: solid transparent;
    border-width: 0 2.5px 2.5px 0;
    transform: rotate(42deg) translateY(-.0625rem);
  }
  .tick:checked { background: var(--accent); border-color: var(--accent); }
  .tick:checked::after { border-color: var(--surface); }
  .tick:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .body { display: flex; flex-direction: column; gap: .3125rem; min-width: 0; }

  .name {
    font-size: .9375rem;
    font-weight: 550;
    line-height: 1.35;
  }
  li.item.done .name { color: var(--faint); }
  li.item.done div.name { text-decoration: line-through; }
  li.item.done .name-btn > span:first-child { text-decoration: line-through; }

  button.name-btn {
    font-family: inherit;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: .5rem;
    width: 100%;
    padding: 0;
    margin: 0;
    border: none;
    background: none;
    color: inherit;
    text-align: left;
    cursor: pointer;
  }
  button.name-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: .25rem; }
  .chev {
    flex: none;
    font-size: 1.125rem;
    line-height: 1;
    color: var(--faint);
    transform: rotate(90deg);
    transition: transform .15s ease, color .12s;
  }
  button.name-btn:hover .chev { color: var(--accent); }
  button.name-btn[aria-expanded="true"] .chev { transform: rotate(270deg); color: var(--accent); }

  .how {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: .5rem;
    margin-top: .0625rem;
    padding: .625rem .75rem .6875rem;
    border-left: 2px solid var(--accent);
    border-radius: 0 .375rem .375rem 0;
    background: var(--surface-2);
  }
  .how ul {
    margin: 0;
    padding-left: 1.0625rem;
    display: flex;
    flex-direction: column;
    gap: .3125rem;
    font-size: .8125rem;
    line-height: 1.5;
    color: var(--dim);
  }
  .how li::marker { color: var(--accent); }
  .how .video {
    font-family: var(--mono);
    font-size: .75rem;
    padding: .3125rem .5rem;
    border: 1px solid var(--line);
    border-radius: .375rem;
    background: var(--surface);
    color: var(--accent);
    text-decoration: none;
    white-space: nowrap;
  }
  .how .video:hover { border-color: var(--accent); }
  .how .video:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .spec {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: .375rem;
    font-family: var(--mono);
    font-size: .75rem;
    color: var(--dim);
    font-variant-numeric: tabular-nums;
  }
  .rest-btn {
    font: inherit;
    padding: .125rem .375rem;
    border: 1px solid var(--line);
    border-radius: .3125rem;
    background: var(--surface-2);
    color: var(--dim);
    cursor: pointer;
  }
  .rest-btn:hover { border-color: var(--accent); color: var(--accent); }
  .rest-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .note {
    font-size: .8125rem;
    color: var(--dim);
    line-height: 1.45;
  }

  .sets {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: .3125rem;
    padding-top: .125rem;
  }
  .set {
    width: 2.25rem;
    height: 2.25rem;
    padding: 0;
    display: grid;
    place-items: center;
    border: 1.5px solid var(--line);
    border-radius: .5rem;
    background: var(--surface-2);
    color: var(--faint);
    font-family: var(--mono);
    font-size: .8125rem;
    font-variant-numeric: tabular-nums;
    cursor: pointer;
    transition: background .12s, border-color .12s, color .12s;
  }
  .set:hover { border-color: var(--accent); color: var(--accent); }
  .set[data-done="1"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--on-accent);
    font-weight: 650;
  }
  .set[data-next="1"] { border-color: var(--accent); border-style: dashed; color: var(--accent); }
  .set:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .set-count {
    font-family: var(--mono);
    font-size: .75rem;
    color: var(--faint);
    font-variant-numeric: tabular-nums;
    margin-left: .1875rem;
  }
  .set-count[data-full="1"] { color: var(--accent); font-weight: 600; }

  input.log {
    font-family: var(--mono);
    font-size: .8125rem;
    padding: .3125rem .5rem;
    width: 100%;
    max-width: 13rem;
    border: 1px solid var(--line);
    border-radius: .375rem;
    background: var(--surface-2);
    color: var(--text);
  }
  input.log::placeholder { color: var(--faint); }
  input.log:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }

  .card > footer {
    padding: .75rem 1rem .875rem;
    border-top: 1px solid var(--line-soft);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    background: var(--surface-2);
  }
  .footnote { font-size: .75rem; color: var(--faint); line-height: 1.4; }
  .reset {
    font: inherit;
    font-size: .8125rem;
    padding: .375rem .625rem;
    border: 1px solid var(--line);
    border-radius: .4375rem;
    background: var(--surface);
    color: var(--dim);
    cursor: pointer;
    white-space: nowrap;
  }
  .reset:hover { color: var(--text); border-color: var(--faint); }
  .card > footer .acts { display: flex; gap: .5rem; }

  /* ---------- สำรองข้อมูล ---------- */
  .backup {
    margin: 0 0 1rem;
    padding: .875rem 1rem 1rem;
    border: 1px solid var(--accent);
    border-radius: .625rem;
    background: var(--surface);
  }
  .backup[hidden] { display: none; }
  .backup p { margin: 0 0 .625rem; font-size: .8125rem; line-height: 1.5; color: var(--dim); }
  .backup textarea {
    width: 100%;
    box-sizing: border-box;
    font-family: var(--mono);
    font-size: .6875rem;
    line-height: 1.4;
    padding: .5rem;
    border: 1px solid var(--line);
    border-radius: .4375rem;
    background: var(--surface-2);
    color: var(--dim);
    resize: vertical;
  }
  .backup .row2 { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-top: .625rem; }
  .backup .say { font-size: .75rem; color: var(--run); }

  /* ---------- sticky status bar ---------- */
  .statusbar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 10;
    background: var(--surface);
    border-top: 1px solid var(--line);
    padding: .625rem 1rem calc(.625rem + env(safe-area-inset-bottom));
  }
  .statusbar .inner {
    max-width: 34rem;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: .875rem;
  }
  .statusbar .note {
    max-width: 34rem;
    margin: 0 auto .5rem;
    font-size: .6875rem;
    line-height: 1.45;
    color: var(--dim);
  }
  .statusbar .note[data-late="1"] { color: var(--run); }
  .statusbar .note[hidden] { display: none; }
  .meter { flex: 1; display: flex; flex-direction: column; gap: .3125rem; min-width: 0; }
  .meter .row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: var(--mono);
    font-size: .75rem;
    color: var(--dim);
    font-variant-numeric: tabular-nums;
  }
  .track { height: .375rem; border-radius: 1rem; background: var(--line); overflow: hidden; }
  .track i { display: block; height: 100%; width: 0; border-radius: 1rem; background: var(--accent); transition: width .25s ease; }

  .timer {
    font-family: var(--mono);
    font-size: 1.125rem;
    font-variant-numeric: tabular-nums;
    min-width: 5.5rem;
    padding: .5rem .625rem;
    border: 1px solid var(--line);
    border-radius: .5rem;
    background: var(--surface-2);
    color: var(--dim);
    cursor: pointer;
    text-align: center;
    letter-spacing: .02em;
  }
  .timer[data-running="1"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .timer[data-done="1"] { border-color: var(--run); color: var(--run); background: var(--run-soft); }
  .timer:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* กำลังปลุก — กะพริบแบบนาฬิกาปลุกจนกว่าจะแตะหยุด */
  .timer[data-alarm="1"] {
    border-color: var(--run);
    background: var(--run-soft);
    color: var(--run);
    font-weight: 650;
    animation: alarmBlink .5s steps(1, end) infinite;
  }
  @keyframes alarmBlink {
    50% { background: var(--run); border-color: var(--run); color: var(--surface); }
  }
  .statusbar[data-alarm="1"] { animation: barBlink .5s steps(1, end) infinite; }
  @keyframes barBlink {
    50% { border-top-color: var(--run); box-shadow: 0 -1px 0 var(--run); }
  }

  .sr-only {
    position: absolute; width: 1px; height: 1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>

<div class="shell">
  <div class="masthead">
    <div class="brand">
      <h1>Hybrid Athlete</h1>
      <span class="ver" id="ver"></span>
    </div>
    <span class="block" id="blockLabel">8 สัปดาห์ · 10 ส.ค. – 4 ต.ค.</span>
    <button class="sound-btn" id="soundBtn" type="button" aria-pressed="true"></button>
    <button class="sound-btn" id="pushBtn" type="button" title="เตือนข้ามแอป">🔔</button>
  </div>

  <nav class="picker" aria-label="เลือกวัน">
    <div class="weeks" id="weeks" role="group" aria-label="สัปดาห์"></div>
    <div class="days" id="days" role="group" aria-label="วันในสัปดาห์"></div>
  </nav>

  <article class="card">
    <header>
      <div class="kicker">
        <span class="chip" id="chip">ยก</span>
        <span id="dateLabel"></span>

        { n: "ยืดสะโพกหน้า (hip flexor)", s: "2 × 45 วิ ต่อข้าง", q: "couch stretch hip flexor runners",

              "สะโพกหน้าตึงจากนั่งทำงานทั้งวัน + วิ่ง = ก้นไม่ทำงาน หลังล่างรับแทน"] },

        { n: "ข้อเท้า (ankle dorsiflexion)", s: "2 × 15 ครั้ง ต่อข้าง", q: "ankle dorsiflexion mobility knee to wall",

        { n: "อกกลาง (thoracic rotation)", s: "2 × 10 ต่อข้าง", q: "thoracic spine rotation stretch open book",
          c: ["ท่า Open Book: นอนตะแคง งอเข่า กางแขนบนเปิดออกไปอีกฝั่ง",
              "ช่วยให้ยกแขนเหนือหัวได้โดยไม่แอ่นหลัง"] }
      ]]]
    };
  }

  // ---------- state ----------
  var store = {};
  try { store = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { store = {}; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
  function rec(key) {
    var r = store[key];
    if (!r) { r = store[key] = { done: {}, log: {}, sets: {} }; }
    if (!r.done) r.done = {};
    if (!r.log) r.log = {};
    if (!r.sets) r.sets = {};
    return r;
  }

  var DAY_NAMES = ["จ", "อ", "พ", "พฤ", "ศ", "ส", "อา"];
  var MONTHS = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.",
                "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];

  function dateOf(week, dayIdx) {
    var d = new Date(START.getTime());
    d.setDate(d.getDate() + (week - 1) * 7 + dayIdx);
    return d;
  }
  function keyOf(d) {
    return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2);
  }
  function sameDay(a, b) { return keyOf(a) === keyOf(b); }

  var today = new Date();
  var cur = { week: 1, day: 0 };
  (function locate() {
    var diff = Math.floor((new Date(today.getFullYear(), today.getMonth(), today.getDate()) - START) / 86400000);
    if (diff >= 0 && diff < 56) { cur.week = Math.floor(diff / 7) + 1; cur.day = diff % 7; }
  })();

  function kindOf(dayIdx) {
    if (dayIdx === 1 || dayIdx === 4 || dayIdx === 5) return "run";
    if (dayIdx === 6) return "rest";
    return "lift";
  }

  // ---------- render ----------
  var elWeeks = document.getElementById("weeks");
  var elDays = document.getElementById("days");
  var elContent = document.getElementById("content");

  function countOf(week, dayIdx) {
    var s = session(week, dayIdx), total = 0;
    for (var i = 0; i < s.groups.length; i++) total += s.groups[i][1].length;
    var r = store[keyOf(dateOf(week, dayIdx))];
    var done = 0;
    if (r) for (var k in r.done) if (r.done[k]) done++;
    return { done: Math.min(done, total), total: total };
  }

  function buildWeeks() {
    elWeeks.innerHTML = "";
    for (var w = 1; w <= 8; w++) {
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = "W" + w;
      b.setAttribute("aria-pressed", w === cur.week ? "true" : "false");
      if (DELOAD[w]) b.setAttribute("data-deload", "1");
      b.title = DELOAD[w] ? "สัปดาห์ " + w + " · DELOAD" : "สัปดาห์ " + w;
      (function (n) { b.addEventListener("click", function () { cur.week = n; render(); }); })(w);
      elWeeks.appendChild(b);
    }
  }

  function buildDays() {
    elDays.innerHTML = "";
    for (var i = 0; i < 7; i++) {
      var d = dateOf(cur.week, i);
      var c = countOf(cur.week, i);
      var b = document.createElement("button");
      b.type = "button";
      b.setAttribute("aria-pressed", i === cur.day ? "true" : "false");
      b.setAttribute("data-kind", kindOf(i));
      if (sameDay(d, today)) b.setAttribute("data-today", "1");
      b.setAttribute("aria-label", DAY_NAMES[i] + " " + d.getDate() + " " + MONTHS[d.getMonth()] +
        " · ทำแล้ว " + c.done + " จาก " + c.total);
      b.innerHTML = '<span>' + DAY_NAMES[i] + '</span><span class="lane"><i style="width:' +
        (c.total ? Math.round(c.done / c.total * 100) : 0) + '%"></i></span>';
      (function (n) { b.addEventListener("click", function () { cur.day = n; render(); }); })(i);
      elDays.appendChild(b);
    }
  }

  function refreshMeter() {
    var c = countOf(cur.week, cur.day);
    document.getElementById("progressText").textContent = c.done + " / " + c.total + " เสร็จ";
    document.getElementById("bar").style.width = (c.total ? c.done / c.total * 100 : 0) + "%";
    document.getElementById("weekText").textContent =
      "W" + cur.week + (DELOAD[cur.week] ? " · DELOAD" : "");
  }

  function render() {
    var s = session(cur.week, cur.day);
    var d = dateOf(cur.week, cur.day);
    var k = keyOf(d);
    var r = rec(k);

    buildWeeks();
    buildDays();

    var chip = document.getElementById("chip");
    chip.setAttribute("data-kind", s.kind);
    chip.textContent = s.kind === "run" ? "วิ่ง" : s.kind === "rest" ? "พัก" : "ยก";

    document.getElementById("dateLabel").textContent =
      DAY_NAMES[cur.day] + " " + d.getDate() + " " + MONTHS[d.getMonth()] +
      (sameDay(d, today) ? " · วันนี้" : "");
    document.getElementById("title").textContent = s.title;
    document.getElementById("subline").textContent =
      s.sub + " · แตะเลขเซตทุกครั้งที่ทำจบ · แตะชื่อท่าเพื่อดูวิธีทำ";
    document.getElementById("footnote").textContent = s.note;

    var banner = document.getElementById("banner");
    if (DELOAD[cur.week] && s.kind === "lift") {
      banner.innerHTML = "<strong>สัปดาห์ DELOAD</strong> — ทำเซตประมาณ 60% (ปัดลง) น้ำหนักเท่าเดิม หยุดที่ RPE 6-7 ห้ามดันสุด";
      banner.hidden = false;
    } else if (DELOAD[cur.week] && s.kind === "run") {
      banner.innerHTML = "<strong>สัปดาห์ DELOAD</strong> — ระยะสั้นลงตั้งใจแล้ว อย่าวิ่งเพิ่มเอง";
      banner.hidden = false;
    } else {
      banner.hidden = true;
    }

    elContent.innerHTML = "";
    var idx = 0;
    s.groups.forEach(function (g) {
      if (g[0]) {
        var h = document.createElement("div");
        h.className = "group-label";
        h.textContent = g[0];
        elContent.appendChild(h);
      }
      var ol = document.createElement("ol");
      ol.className = "items";
      g[1].forEach(function (it) {
        ol.appendChild(itemNode(it, idx++, r, k));
      });
      elContent.appendChild(ol);
    });

    refreshMeter();
  }

  // "5 × 4-6 · RPE 8" -> 5   |   "6 × 400 ม." -> 6   |   "10-12 นาที" -> 0
  function setCount(spec) {
    var m = /^\s*(\d+)\s*×/.exec(spec || "");
    var n = m ? parseInt(m[1], 10) : 0;
    return (n > 0 && n <= 12) ? n : 0;
  }

  function itemNode(it, i, r, k) {
    var li = document.createElement("li");
    li.className = "item" + (r.done[i] ? " done" : "");

    var total = setCount(it.s);
    if (!r.sets) r.sets = {};

    var cb = document.createElement("input");
    cb.type = "checkbox";
    cb.className = "tick";
    cb.checked = !!r.done[i];
    cb.setAttribute("aria-label", it.n);
    cb.addEventListener("change", function () {
      r.done[i] = cb.checked;
      li.classList.toggle("done", cb.checked);
      if (total) { r.sets[i] = cb.checked ? total : 0; paintSets(); }
      save();
      buildDays();
      refreshMeter();
      if (cb.checked && it.r && !total) startTimer(it.r);
    });

    var pills = [], counter = null;
    function paintSets() {
      var done = r.sets[i] || 0;
      for (var p = 0; p < pills.length; p++) {
        if (p < done) pills[p].setAttribute("data-done", "1");
        else pills[p].removeAttribute("data-done");
        if (p === done) pills[p].setAttribute("data-next", "1");
        else pills[p].removeAttribute("data-next");
      }
      if (counter) {
        counter.textContent = done + "/" + total + " เซต";
        if (done >= total) counter.setAttribute("data-full", "1");
        else counter.removeAttribute("data-full");
      }
    }

    var body = document.createElement("div");
    body.className = "body";

    var how = null;
    if (it.c || it.q) {
      var name = document.createElement("button");
      name.type = "button";
      name.className = "name name-btn";
      name.setAttribute("aria-expanded", "false");
      name.innerHTML = '<span></span><span class="chev" aria-hidden="true">›</span>';
      name.firstChild.textContent = it.n;
      body.appendChild(name);

      how = document.createElement("div");
      how.className = "how";
      how.hidden = true;

      if (it.c) {
        var ul = document.createElement("ul");
        it.c.forEach(function (line) {
          var li2 = document.createElement("li");
          li2.textContent = line;
          ul.appendChild(li2);
        });
        how.appendChild(ul);
      }
      if (it.q) {
        var a = document.createElement("a");
        a.className = "video";
        a.href = "https://www.youtube.com/results?search_query=" + encodeURIComponent(it.q);
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.textContent = "▶ ดูวิดีโอสาธิต";
        how.appendChild(a);
      }

      name.addEventListener("click", function () {
        var open = name.getAttribute("aria-expanded") === "true";
        name.setAttribute("aria-expanded", open ? "false" : "true");
        how.hidden = open;
      });
    } else {
      var plain = document.createElement("div");
      plain.className = "name";
      plain.textContent = it.n;
      body.appendChild(plain);
    }

    if (it.s) {
      var spec = document.createElement("div");
      spec.className = "spec";
      var sp = document.createElement("span");
      sp.textContent = it.s;
      spec.appendChild(sp);
      if (it.r) {
        var rb = document.createElement("button");
        rb.type = "button";
        rb.className = "rest-btn";
        rb.textContent = "พัก " + fmt(it.r);
        rb.addEventListener("click", function () { startTimer(it.r); });
        spec.appendChild(rb);
      }
      body.appendChild(spec);
    }

    if (total) {
      var wrap = document.createElement("div");
      wrap.className = "sets";
      wrap.setAttribute("role", "group");
      wrap.setAttribute("aria-label", "นับเซต " + it.n);

      for (var p = 1; p <= total; p++) {
        var pill = document.createElement("button");
        pill.type = "button";
        pill.className = "set";
        pill.textContent = p;
        pill.setAttribute("aria-label", "เซตที่ " + p);
        (function (n) {
          pill.addEventListener("click", function () {
            var was = r.sets[i] || 0;
            // แตะเซตที่ทำไปแล้ว = ถอยกลับ / แตะเซตข้างหน้า = นับถึงเซตนั้น
            r.sets[i] = (was >= n) ? n - 1 : n;
            var full = r.sets[i] >= total;
            r.done[i] = full;
            cb.checked = full;
            li.classList.toggle("done", full);
            paintSets();
            save();
            buildDays();
            refreshMeter();
            if (r.sets[i] > was && !full && it.r) startTimer(it.r);
          });
        })(p);
        pills.push(pill);
        wrap.appendChild(pill);
      }

      counter = document.createElement("span");
      counter.className = "set-count";
      wrap.appendChild(counter);
      body.appendChild(wrap);
      paintSets();
    }

    if (it.d) {
      var note = document.createElement("div");
      note.className = "note";
      note.textContent = it.d;
      body.appendChild(note);
    }

    if (how) body.appendChild(how);

    if (it.log) {
      var inp = document.createElement("input");
      inp.className = "log";
      inp.type = "text";
      inp.value = r.log[i] || "";
      inp.placeholder = "จดน้ำหนัก / เวลา…";
      inp.setAttribute("aria-label", "บันทึกผล " + it.n);
      inp.addEventListener("input", function () { r.log[i] = inp.value; save(); });
      body.appendChild(inp);
    }

    li.appendChild(cb);
    li.appendChild(body);
    return li;
  }

  // ---------- rest timer ----------
  // นับจาก "เวลาเส้นตาย" ไม่ใช่ลดทีละวินาที — หน้าจอดับหรือสลับแอปแล้วเวลายังเดินต่อ
  var elTimer = document.getElementById("timer");
  var elSay = document.getElementById("timerSay");
  var elSound = document.getElementById("soundBtn");
  var elNote = document.getElementById("restNote");
  var TIMER_TIP = elTimer.title;
  var TKEY = "hybrid26.rest", SKEY = "hybrid26.sound";
  var soundOn = true;
  try { soundOn = localStorage.getItem(SKEY) !== "0"; } catch (e) {}
  var tHandle = null, tEnd = 0, tRunning = false;
  var elBar = document.querySelector(".statusbar");
  var actx = null, beeps = [], beepGen = 0, armedCtxAt = -1, wake = null;

  // ---- เสียงเตือนแบบนาฬิกาปลุก ----
  // จองเสียงทั้งชุดไว้ล่วงหน้าใน Web Audio ไม่ได้ไล่เล่นด้วย setInterval
  // เพราะถ้าแท็บถูกพักไว้ interval จะไม่ทำงาน แต่เสียงที่จองไว้ยังดังตรงเวลา

  // ตั้งเฉพาะตอนจะมีเสียงจริง แล้วคืนค่าเดิมทันทีที่เลิก เพลงจะได้ไม่โดนหรี่ค้าง

  // การจองเสียงไว้ล่วงหน้า 90 วิ ไม่นับว่าเล่น เลยต้องยิงบัฟเฟอร์เงียบ 1 เฟรมทิ้งตอนแตะครั้งแรก

    }

  // ---- ปลุก: ดังและกะพริบจนกว่าจะแตะหยุด (หรือครบ ALARM_SEC) ----
  function dismissOutside(e) {
    if (elTimer.contains(e.target)) return;   // แตะที่ปุ่มเอง ปล่อยให้ click handler จัดการ จะได้ไม่เริ่มจับเวลาใหม่

    elTimer.setAttribute("aria-label", "พักครบแล้ว — แตะเพื่อหยุดเสียงปลุก");

  function endRest() {

    cancelBeep();
    clearInterval(tHandle);

      "เปิดอยู่ — พอสลับไปแอปอื่นระหว่างพัก เซิร์ฟเวอร์จะยิงแจ้งเตือนมาตอนหมดเวลาพอดี ต้องมีเน็ตด้วย";
    else elPushWhy.textContent =
      "เปิดแล้วจะเตือนได้ตอนสลับไปแอปอื่น โดยเสียงเพลงไม่หยุด (แต่ถ้าปิดสวิตช์เงียบไว้ iOS จะไม่ให้มีเสียง)";
  }

  function pushApi(path, body, useBeacon) {
    if (!PUSH_API) return Promise.reject(new Error("ยังไม่ได้ตั้งค่าเซิร์ฟเวอร์"));
    var url = PUSH_API.replace(/\/$/, "") + path;
    var text = JSON.stringify(body);
    // ตอนสลับออกจากแอป fetch มักโดนฆ่ากลางทาง — sendBeacon ออกแบบมาสำหรับจังหวะนี้
    // ใช้ text/plain เพื่อไม่ให้เกิด preflight ซึ่ง sendBeacon ทำไม่ได้
    if (useBeacon && navigator.sendBeacon) {
      try {
        if (navigator.sendBeacon(url, new Blob([text], { type: "text/plain" }))) return Promise.resolve(null);
      } catch (e) {}
    }
    return fetch(url, {
      method: "POST", body: text, keepalive: true,
      headers: { "Content-Type": "text/plain" },
    }).then(function (r) { return r.json().catch(function () { return {}; }); });
  }

  function pushSchedule(sec) {
    var s = pushSub();
    if (!s || !(sec > 0)) return;
    pushApi("/api/schedule", { sub: s, inSec: Math.ceil(sec) }, true).catch(function () {});
  }
  function pushCancel() {
    var s = pushSub();
    if (!s) return;
    pushApi("/api/cancel", { sub: s }, false).catch(function () {});
  }

  function pushEnable() {
    if (!PUSH_API) { pushSay("ยังไม่ได้ตั้งค่าเซิร์ฟเวอร์"); return; }
    if (!pushSupported()) { pushSay("เบราว์เซอร์นี้ไม่รองรับ"); return; }
    if (!installedApp()) { pushSay("ต้องเปิดจากไอคอนหน้าโฮมก่อน"); return; }
    pushSay("กำลังเปิด...");
    Promise.resolve(Notification.requestPermission()).then(function (p) {
      if (p !== "granted") throw new Error("ไม่ได้อนุญาตแจ้งเตือน — เปิดได้ที่ ตั้งค่า > การแจ้งเตือน");
      return navigator.serviceWorker.register("sw.js");
    }).then(function (reg) {
      swReg = reg;
      return navigator.serviceWorker.ready;
    }).then(function (reg) {
      return reg.pushManager.getSubscription().then(function (existing) {
        return existing || reg.pushManager.subscribe({
          userVisibleOnly: true, applicationServerKey: vapidBytes(VAPID_PUBLIC),
        });
      });
    }).then(function (sub) {
      // เขียนลง storage ตรงนี้ได้ เพราะมาจากการแตะปุ่ม ไม่ใช่ตอนโหลดหน้า
      try { localStorage.setItem(PKEY, JSON.stringify(sub)); } catch (e) {}
      paintPush();
      pushSay("เปิดแล้ว — กดทดสอบเสียงดูได้เลย");
    }).catch(function (e) {
      pushSay((e && e.message) || "เปิดไม่สำเร็จ");
    });
  }

  function pushDisable() {
    var s = pushSub();
    if (s) pushApi("/api/cancel", { sub: s }, false).catch(function () {});
    try { localStorage.removeItem(PKEY); } catch (e) {}
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistration) {
      navigator.serviceWorker.getRegistration().then(function (reg) {
        if (reg) reg.pushManager.getSubscription().then(function (sub) { if (sub) sub.unsubscribe(); });
      }).catch(function () {});
    }
    paintPush();
    pushSay("ปิดแล้ว");
  }

  if (elPushOn) elPushOn.addEventListener("click", pushEnable);
  if (elPushOff) elPushOff.addEventListener("click", pushDisable);
  if (elPushTest) {
    elPushTest.addEventListener("click", function () {
      pushSay("กำลังส่ง...");
      pushApi("/api/test", { sub: pushSub() }, false).then(function (r) {
        pushSay(r && r.ok ? "ส่งแล้ว — สลับไปแอปอื่นแล้วรอดู" : "ส่งไม่สำเร็จ" + (r && r.status ? " (" + r.status + ")" : ""));
      }, function () { pushSay("ต่อเซิร์ฟเวอร์ไม่ได้"); });
    });
  }
  (function () {
    var btn = document.getElementById("pushBtn");
    if (!btn || !elPushPanel) return;
    btn.addEventListener("click", function () {
      elPushPanel.hidden = !elPushPanel.hidden;
      if (!elPushPanel.hidden) { paintPush(); pushSay(""); }
    });
    paintPush();
    if (PUSH_API && pushSupported() && !pushSub()) elPushPanel.hidden = false;   // ยังไม่ได้เปิด = โชว์ให้เห็น
  })();

  // ---------- สำรองข้อมูล ----------
  // อ่านอย่างเดียว ห้ามเขียนอะไรลง storage ในบล็อกนี้หรือตอนโหลดหน้าเด็ดขาด
  // ถ้าข้อมูลชุดสุดท้ายยังเหลืออยู่ในเครื่อง การเขียนตอนโหลดจะทับมันหายถาวร
  (function () {
    var panel = document.getElementById("backupPanel");
    var area = document.getElementById("backupText");
    var say = document.getElementById("backupSay");
    var btnOpen = document.getElementById("backup");
    var btnCopy = document.getElementById("backupCopy");
    var btnShare = document.getElementById("backupShare");
    var btnClose = document.getElementById("backupClose");
    if (!panel || !area || !btnOpen) return;

    function note(msg) { if (say) say.textContent = msg; }
    function fileName() { return "hybrid-backup-" + keyOf(new Date()) + ".json"; }

    // เก็บทุกคีย์ของแอป ไม่ใช่แค่ตารางเทรน — ธีมกับปุ่มเสียงก็หายไปพร้อมกัน
    function dump() {
      var out = {};
      try {
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (k && k.indexOf("hybrid26.") === 0) out[k] = localStorage.getItem(k);
        }
      } catch (e) {}
      return JSON.stringify({ app: "hybrid-athlete", v: VERSION, at: keyOf(new Date()), data: out });
    }

    // เลือกข้อความให้พร้อมก๊อป — พังตรงนี้ห้ามทำให้ทั้ง handler ตาย ไม่งั้นข้อความสำรองไม่ขึ้น
    function selectAll() {
      try {
        area.focus();
        if (area.setSelectionRange) area.setSelectionRange(0, area.value.length);
        else if (area.select) area.select();
      } catch (e) {}
    }

    btnOpen.addEventListener("click", function () {
      area.value = dump();
      panel.hidden = false;
      note("");
      selectAll();
    });
    if (btnClose) btnClose.addEventListener("click", function () { panel.hidden = true; });

    if (btnCopy) {
      btnCopy.addEventListener("click", function () {
        selectAll();
        var done = function () { note("คัดลอกแล้ว — เอาไปวางเก็บไว้เลย"); };
        var fail = function () { note("ก๊อปเองได้เลย เลือกข้อความไว้ให้แล้ว"); };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(area.value).then(done, function () {
            var ok = false;
            try { ok = document.execCommand("copy"); } catch (e) {}
            if (ok) done(); else fail();
          });
        } else {
          var ok = false;
          try { ok = document.execCommand("copy"); } catch (e) {}
          if (ok) done(); else fail();
        }
      });
    }

    // นำเข้า: เติมเฉพาะวันที่ยังไม่มี ไม่ทับของเดิม
    // เอาไฟล์สำรองเก่ามาใส่ทับตรง ๆ จะกลบวันที่เพิ่งติ๊กไปหลังจากสำรอง
    function merge(text) {
      var pack;
      try { pack = JSON.parse(text); } catch (e) { return { err: "อ่านข้อความไม่ออก — ต้องเป็นข้อความที่ได้จากปุ่มสำรองข้อมูล" }; }
      if (!pack || pack.app !== "hybrid-athlete" || !pack.data) return { err: "ไม่ใช่ข้อมูลสำรองของแอปนี้" };

      var old = {};
      try { old = JSON.parse(pack.data["hybrid26.v1"] || "{}") || {}; } catch (e) { return { err: "ข้อมูลตารางเทรนในไฟล์เสีย" }; }
      var now = {};
      try { now = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) {}

      var added = 0, kept = 0, k;
      for (k in old) {
        if (!Object.prototype.hasOwnProperty.call(old, k)) continue;
        if (Object.prototype.hasOwnProperty.call(now, k)) { kept++; continue; }
        now[k] = old[k];
        added++;
      }
      try { localStorage.setItem(KEY, JSON.stringify(now)); } catch (e) { return { err: "เขียนข้อมูลไม่สำเร็จ" }; }

      // ตั้งค่า (ธีม/เสียง) เติมเฉพาะที่ยังไม่เคยตั้งในเครื่องนี้
      ["hybrid26.theme", "hybrid26.sound"].forEach(function (sk) {
        try { if (pack.data[sk] != null && localStorage.getItem(sk) == null) localStorage.setItem(sk, pack.data[sk]); } catch (e) {}
      });
      return { added: added, kept: kept };
    }

    var btnLoad = document.getElementById("backupLoad");
    if (btnLoad) {
      btnLoad.addEventListener("click", function () {
        var r = merge(area.value);
        if (r.err) { note(r.err); return; }
        note("เพิ่มมา " + r.added + " วัน / ของเดิมในเครื่องเก็บไว้ " + r.kept + " วัน");
        store = {};
        try { store = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) {}
        render();
      });
    }

    // แชร์เป็นไฟล์ผ่าน share sheet ของ iOS — ลิงก์ download เชื่อถือไม่ได้บน Safari
    if (btnShare) {
      var canFile = false;
      try {
        canFile = !!(navigator.share && navigator.canShare &&
          navigator.canShare({ files: [new File(["{}"], "t.json", { type: "application/json" })] }));
      } catch (e) { canFile = false; }
      if (canFile) {
        btnShare.hidden = false;
        btnShare.addEventListener("click", function () {
          try {
            var f = new File([area.value], fileName(), { type: "application/json" });
            navigator.share({ files: [f], title: "Hybrid Athlete backup" }).then(
              function () { note("ส่งออกเป็นไฟล์แล้ว"); },
              function () { note("ยังไม่ได้เซฟ — ใช้ปุ่มคัดลอกแทนได้"); });
          } catch (e) { note("แชร์ไม่ได้ — ใช้ปุ่มคัดลอกแทน"); }
        });
      }
    }
  })();

  document.getElementById("reset").addEventListener("click", function () {
    var k = keyOf(dateOf(cur.week, cur.day));
    delete store[k];
    save();
    render();
  });

  render();
})();
</script>
<script>

(function () {
  "use strict";
  var KEY = "hybrid26.theme";
  var root = document.documentElement;
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved === "dark" || saved === "light") root.setAttribute("data-theme", saved);

  var btn = document.createElement("button");
  btn.type = "button";
  btn.className = "theme-btn";
  function label() {
    var t = root.getAttribute("data-theme");
    btn.textContent = t === "dark" ? "\u263e มืด" : t === "light" ? "\u2600 สว่าง" : "\u25d1 อัตโนมัติ";
    btn.setAttribute("aria-label", "สลับธีม — ตอนนี้: " + btn.textContent);
  }
  btn.addEventListener("click", function () {
    var t = root.getAttribute("data-theme");
    var next = t === "dark" ? "light" : t === "light" ? null : "dark";
    if (next) { root.setAttribute("data-theme", next); try { localStorage.setItem(KEY, next); } catch (e) {} }
    else { root.removeAttribute("data-theme"); try { localStorage.removeItem(KEY); } catch (e) {} }
    label();
  });
  label();

  var head = document.querySelector(".masthead");
  if (head) head.appendChild(btn);
})();

</script>
</body>
</html>
